<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">

    <meta property="og:title" content="التسويق الرقمي | زين الدين ماجد">
    <meta property="og:description" content="استراتيجيات، حملات مدفوعة، تقاويم محتوى، وبناء الهوية التجارية من الصفر للشركات.">

    <title>التسويق الرقمي | زين الدين ماجد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'nb-yellow':   '#FFE566',
                        'nb-peach':    '#FFB4A2',
                        'nb-mint':     '#B5EAD7',
                        'nb-lavender': '#C7B8EA',
                        'nb-sky':      '#A8D8EA',
                        'nb-ink':      '#1A1A2E',
                        'nb-ink2':     '#16213E',
                        'nb-cream':    '#FFFBF0',
                        'nb-card':     '#F5F0E8',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --nb-shadow-sm:  3px 3px 0 #1A1A2E;
            --nb-shadow-md:  5px 5px 0 #1A1A2E;
            --nb-shadow-lg:  8px 8px 0 #1A1A2E;
            --nb-shadow-xl: 12px 12px 0 #1A1A2E;
        }
        .dark {
            --nb-shadow-sm:  3px 3px 0 #090D1C;
            --nb-shadow-md:  5px 5px 0 #090D1C;
            --nb-shadow-lg:  8px 8px 0 #090D1C;
            --nb-shadow-xl: 12px 12px 0 #090D1C;
        }

        html.dark body { background:#10182C; }

        body { font-family: 'Almarai', sans-serif; overflow-x: hidden; }
        * { word-wrap: break-word; }
        img { max-width: 100%; }

        .nb-nav { border-bottom: 3px solid #1A1A2E; }
        .dark .nb-nav { border-bottom-color: #FFE566; }

        .nb-divider { border-top: 3px solid #1A1A2E; }
        .dark .nb-divider { border-top-color: #FFE566; }

        .nb-badge {
            border: 2px solid #1A1A2E;
            box-shadow: 2px 2px 0 #1A1A2E;
            font-weight: 900;
        }
        .dark .nb-badge { border-color: #FFE566; box-shadow: 2px 2px 0 #FFE566; }

        .portfolio-card {
            border: 3px solid #1A1A2E;
            box-shadow: var(--nb-shadow-md);
            transition: box-shadow 0.15s ease, transform 0.15s ease;
            border-radius: 16px;
        }
        html.dark .portfolio-card { border-color: #667493; background: #1A2946 !important; }
        .portfolio-card:hover { box-shadow: var(--nb-shadow-xl); transform: translate(-4px,-4px); }

        .skill-tag {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 14px; border-radius: 100px; font-size: 0.8rem;
            font-weight: 800; border: 2px solid #1A1A2E;
            box-shadow: 2px 2px 0 #1A1A2E; background: #FFFBF0; color: #1A1A2E;
        }
        html.dark .skill-tag { background: #1B3F3A; border-color: #6FCAB7; box-shadow: 2px 2px 0 #090D1C; color: #FFFBF0; }

        .nb-stripe {
            background-image: repeating-linear-gradient(
                -45deg, transparent, transparent 10px,
                rgba(26,26,46,0.035) 10px, rgba(26,26,46,0.035) 11px
            );
        }
        .dark .nb-stripe {
            background-image: repeating-linear-gradient(
                -45deg, transparent, transparent 10px,
                rgba(255,229,102,0.04) 10px, rgba(255,229,102,0.04) 11px
            );
        }

        #mobile-menu { max-height: 0; overflow: hidden; transition: max-height 0.35s ease, opacity 0.3s ease; opacity: 0; }
        #mobile-menu.open { max-height: 500px; opacity: 1; }

        html.dark .page-header { background-color:#15213A !important; }
        html.dark .page-projects-section { background:#111D35 !important; }

        /* Paper-plane cursor: enabled only by the script on mouse devices. */
        #paper-plane-trail, #paper-plane-cursor { position:fixed; pointer-events:none; opacity:0; transition:opacity .2s ease; }
        #paper-plane-trail { inset:0; z-index:9997; }
        #paper-plane-cursor { top:0; left:0; width:28px; height:28px; z-index:9998; transform-origin:center; }
        #paper-plane-cursor svg { display:block; width:100%; height:100%; filter:drop-shadow(2px 2px 0 rgba(26,26,46,.18)); }
        #paper-plane-cursor.is-over-action svg { animation:planeFlap .45s ease-in-out infinite alternate; filter:drop-shadow(2px 3px 0 rgba(26,26,46,.25)); }
        #paper-plane-cursor.is-over-action path:first-child { fill:#B5EAD7; }
        .plane-target { box-shadow:0 0 0 4px rgba(181,234,215,.6), var(--nb-shadow-md) !important; }
        html.dark .plane-target { box-shadow:0 0 0 4px rgba(181,234,215,.55), 5px 5px 0 #FFE566 !important; }
        @keyframes planeFlap { from{transform:rotate(-10deg) translateY(0)} to{transform:rotate(10deg) translateY(-3px)} }
        .paper-plane-cursor-ready #paper-plane-trail, .paper-plane-cursor-ready #paper-plane-cursor { opacity:1; }
        @media (pointer:fine) and (prefers-reduced-motion:no-preference) {
            .paper-plane-cursor-ready, .paper-plane-cursor-ready * { cursor:none !important; }
        }
    </style>
</head>

            <h1 class="text-4xl md:text-5xl font-black text-nb-ink dark:text-nb-cream mb-4">التسويق الرقمي والميديا باينج</h1>
            <p class="text-base font-medium text-nb-ink/70 dark:text-nb-cream/70 max-w-xl mx-auto leading-relaxed">
                استراتيجيات، حملات مدفوعة، تقاويم محتوى، وبناء الهوية التجارية من الصفر للشركات.

    <section class="page-projects-section py-16 bg-nb-card dark:bg-nb-ink2 min-h-[50vh]">

        </div>
    </section>

    <script src="assets/js/projects-data.js"></script>
    <script>
        const currentLang = "ar";

        const applyTheme = (isDark) => {
            isDark ? document.documentElement.classList.add('dark') : document.documentElement.classList.remove('dark');
            localStorage.setItem('color-theme', isDark ? 'dark' : 'light');
        };

        const syncThemeIcons = () => {
            const dark = document.documentElement.classList.contains('dark');
            document.getElementById('theme-toggle-dark-icon')?.classList.toggle('hidden', dark);
            document.getElementById('theme-toggle-light-icon')?.classList.toggle('hidden', !dark);
            document.querySelector('.theme-dark-icon')?.classList.toggle('hidden', dark);
            document.querySelector('.theme-light-icon')?.classList.toggle('hidden', !dark);
        };

        applyTheme(localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches));
        syncThemeIcons();

        document.getElementById('theme-toggle')?.addEventListener('click', () => { applyTheme(!document.documentElement.classList.contains('dark')); syncThemeIcons(); });
        document.getElementById('mobile-theme-toggle')?.addEventListener('click', () => { applyTheme(!document.documentElement.classList.contains('dark')); syncThemeIcons(); });

        document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
            const menu = document.getElementById('mobile-menu');
            const hamburger = document.getElementById('hamburger-icon');
            const closeIcon = document.getElementById('close-icon');
            menu.classList.toggle('open');
            hamburger?.classList.toggle('hidden');
            closeIcon?.classList.toggle('hidden');
        });

        document.addEventListener('DOMContentLoaded', () => {
            const gridContainer = document.getElementById('projects-grid');

            if (typeof marketingProjects === 'undefined' || marketingProjects.length === 0) {
                gridContainer.innerHTML = `
                    <div class="col-span-full text-center py-24">
                        <div class="w-16 h-16 bg-nb-peach border-4 border-nb-ink rounded-2xl flex items-center justify-center mx-auto mb-5 text-3xl" style="box-shadow: 4px 4px 0 #1A1A2E;">📱</div>
                        <h3 class="text-xl font-black text-nb-ink dark:text-nb-cream mb-2">لا توجد مشاريع حتى الآن</h3>
                    </div>`;
                return;
            }

            marketingProjects.forEach(project => {
                const title = getText(project.title, currentLang);
                const desc = getText(project.shortDescription, currentLang);
                const thumb = project.thumbnail ? `${project.thumbnail}` : '';
                const toolsHTML = (project.tools || []).map(t => `<span class="skill-tag">${t}</span>`).join('');

                gridContainer.innerHTML += `
                    <a href="project-detail.html?id=${project.id}" class="portfolio-card group bg-nb-cream dark:bg-nb-ink p-4 flex flex-col h-full relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-2.5 bg-nb-peach"></div>
                        <div class="aspect-video overflow-hidden relative bg-nb-ink rounded-xl border-2 border-nb-ink dark:border-nb-yellow mt-2" style="box-shadow: 3px 3px 0 currentColor;">
                            ${thumb ? `<img src="${thumb}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">` : `<div class="w-full h-full flex items-center justify-center text-4xl bg-nb-peach">📱</div>`}
                        </div>
                        <div class="pt-5 pb-2 flex-grow flex flex-col">
                            <h3 class="text-xl font-black text-nb-ink dark:text-nb-cream mb-2 leading-snug">${title}</h3>
                            <p class="text-sm font-medium text-nb-ink/70 dark:text-nb-cream/70 mb-4 flex-grow leading-relaxed">${desc}</p>
                            ${toolsHTML ? `<div class="flex flex-wrap gap-1.5 mb-4">${toolsHTML}</div>` : ''}
                            <div class="mt-auto pt-4 border-t-2 border-nb-ink/10 dark:border-nb-yellow/10 flex items-center justify-between">
                                <span class="inline-flex items-center gap-1.5 text-xs font-black text-nb-ink dark:text-nb-yellow">
                                    عرض التفاصيل
                                    <svg class="w-4 h-4 group-hover:-translate-x-1 transition-transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7-7 7M3 12h18"></path></svg>
                                </span>
                            </div>
                        </div>
                    </a>`;
            });
        });

        /* ── Paper-plane cursor with a soft dashed trail (mouse devices only) ── */
        const cursorMedia = window.matchMedia('(pointer: fine) and (prefers-reduced-motion: no-preference)');
        if (cursorMedia.matches) {
            const plane = document.getElementById('paper-plane-cursor');
            const trail = document.getElementById('paper-plane-trail');
            const context = trail.getContext('2d');
            const points = [];
            let cursorX = window.innerWidth / 2;
            let cursorY = window.innerHeight / 2;
            let lastX = cursorX;
            let lastY = cursorY;
            let angle = 0;
            let planeScale = 1;
            let frameId;

            function resizeTrail() {
                const ratio = Math.min(window.devicePixelRatio || 1, 2);
                trail.width = window.innerWidth * ratio;
                trail.height = window.innerHeight * ratio;
                trail.style.width = `${window.innerWidth}px`;
                trail.style.height = `${window.innerHeight}px`;
                context.setTransform(ratio, 0, 0, ratio, 0, 0);
            }

            function drawTrail() {
                context.clearRect(0, 0, window.innerWidth, window.innerHeight);
                if (points.length > 1) {
                    context.setLineDash([5, 8]);
                    context.lineWidth = 1.5;
                    context.lineCap = 'round';
                    context.lineDashOffset = -performance.now() / 38;
                    for (let i = 1; i < points.length; i++) {
                        context.beginPath();
                        context.moveTo(points[i - 1].x, points[i - 1].y);
                        context.lineTo(points[i].x, points[i].y);
                        const trailColor = document.body.classList.contains('plane-over-action')
                            ? '181, 234, 215'
                            : document.documentElement.classList.contains('dark') ? '255, 229, 102' : '26, 26, 46';
                        context.strokeStyle = `rgba(${trailColor}, ${0.04 + (i / points.length) * 0.22})`;
                        context.stroke();
                    }
                }
                plane.style.transform = `translate3d(${cursorX - 14}px, ${cursorY - 14}px, 0) rotate(${angle}deg) scale(${planeScale})`;
                frameId = requestAnimationFrame(drawTrail);
            }

            document.addEventListener('pointermove', event => {
                if (event.pointerType !== 'mouse') return;
                cursorX = event.clientX;
                cursorY = event.clientY;
                const deltaX = cursorX - lastX;
                const deltaY = cursorY - lastY;
                if (Math.abs(deltaX) + Math.abs(deltaY) > 1) angle = Math.atan2(deltaY, deltaX) * 180 / Math.PI + 45;
                lastX = cursorX;
                lastY = cursorY;
                points.push({ x: cursorX, y: cursorY });
                if (points.length > 15) points.shift();
            }, { passive:true });

            /* Event delegation: works for cards rendered dynamically after page load. */
            document.addEventListener('pointerover', event => {
                const target = event.target.closest('a, button, [onclick]');
                if (!target || target.contains(event.relatedTarget)) return;
                document.body.classList.add('plane-over-action');
                plane.classList.add('is-over-action');
                planeScale = 1.38;
                if (target.matches('button, .nb-btn, .nb-btn-ghost')) target.classList.add('plane-target');
            });
            document.addEventListener('pointerout', event => {
                const target = event.target.closest('a, button, [onclick]');
                if (!target || target.contains(event.relatedTarget)) return;
                document.body.classList.remove('plane-over-action');
                plane.classList.remove('is-over-action');
                planeScale = 1;
                target.classList.remove('plane-target');
            });

            window.addEventListener('resize', resizeTrail, { passive:true });
            resizeTrail();
            document.body.classList.add('paper-plane-cursor-ready');
            frameId = requestAnimationFrame(drawTrail);
            window.addEventListener('pagehide', () => cancelAnimationFrame(frameId), { once:true });
        }
    </script>
